baseURL = 'https://adamthede.com/'
languageCode = 'en-us'
title = 'Adam Thede'
enableRobotsTXT = true

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[params]
  description = "I'm a product person who builds with AI agents, at Possip by day, and evenings and weekends on my own apps for capturing, enriching and synthesizing a life."
  author = "Adam Thede"
  email = "adam@thedetech.com"
  linkedin = "https://linkedin.com/in/adamthede"
  github = "https://github.com/adamthede"
  location = "Nashville, TN"
  thedetech = "https://thedetech.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'dracula'
    lineNos = false

[outputs]
  home = ['HTML', 'RSS']

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
